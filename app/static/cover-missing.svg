<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180"
     role="img" aria-label="Pas de couverture disponible">
  <title>Pas de couverture disponible</title>
  <!-- Servie à la place d'une erreur quand aucun catalogue n'a de vignette pour
       cet ISBN — cas courant des albums jeunesse et des petites éditions. Le
       cadre et le fond viennent du CSS (.couverture) ; ici, seulement le motif.
       Livre ouvert du logo, sans l'étincelle : c'est un emplacement vide, pas
       une marque. -->
  <rect width="120" height="180" fill="#f6f7f9"/>
  <g transform="translate(36 60) scale(2)" fill="none" stroke="#cbd2dc"
     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.2A2.2 2.2 0 0 1 5.2 8H10a2 2 0 0 1 2 2 2 2 0 0 1 2-2h4.8A2.2 2.2 0 0 1 21 10.2V17.8A2.2 2.2 0 0 1 18.8 20H14a2 2 0 0 0-2 2 2 2 0 0 0-2-2H5.2A2.2 2.2 0 0 1 3 17.8z"/>
    <path d="M12 10v11.5"/>
  </g>
</svg>
