name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Code coverage
        run: go tool cover -func=coverage.out

# The Docker image is not built here: it is heavy and per-commit :latest served
# no one — schools deploy the release's :stable image, developers run `make dev`
# (or `make dev-docker` to exercise the Dockerfile). The image is built, for
# amd64 and arm64, only by the release workflow.
